name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and build CSS
        run: npm ci && npm run build

      - name: Stamp the last commit date into the footer
        run: |
          DATE=$(git log -1 --format=%cd --date=format:'%B %-d, %Y')
          sed -i "s|<span id=\"last-updated\">[^<]*</span>|<span id=\"last-updated\">$DATE</span>|" index.html

      # node_modules is only needed to build the CSS; publishing it would add
      # ~20 MB to every deploy.
      - name: Remove build-only files
        run: rm -rf node_modules

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
